# This workflow triggers Datadog Synthetic tests within your Datadog organisation.
# Docs: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

# Setup:
# 1. Add your Datadog API key (DD_API_KEY) and Application key (DD_APP_KEY) as
#    repository secrets (Settings -> Secrets and variables -> Actions).
#    Never commit keys to the YAML. https://docs.datadoghq.com/account_management/api-app-keys/
# 2. The action runs every Synthetic test tagged `e2e-tests` on push/PR to main.

name: Run Datadog Synthetic tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@v3.8.2 # bumped from v1.4.0 (Node 20 deprecation)
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
          tunnel: false
